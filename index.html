<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формы авто — справочник</title>
<style>
:root{--bg:#f4f6fb;--paper:#fff;--ink:#182230;--muted:#687386;--line:#e5e9f1;--blue:#315be8;--blue2:#eaf0ff;--green:#15965b;--red:#d83d3d;--shadow:0 12px 34px rgba(25,39,75,.08);--r:17px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}.container{max-width:1180px;margin:auto;padding:0 22px}
header{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:850;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}.brand-icon{width:37px;height:37px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center}.nav{display:flex;gap:8px}.nav a{padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:650}.nav a:hover,.nav a.active{background:var(--blue2);color:var(--blue)}
#app{min-height:calc(100vh - 140px);padding:38px 0 65px}.page-head{margin-bottom:24px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.page-head h1{font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-1.3px;margin:8px 0}.page-head p{color:var(--muted);margin:0}.toolbar{display:flex;gap:12px;margin:25px 0 22px}.control{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;color:var(--ink)}.control:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315be81a}.toolbar input{flex:1;min-width:150px}.toolbar select{min-width:190px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.car-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.2s}.car-card:hover{transform:translateY(-4px);box-shadow:0 17px 38px #1a2a5017}.car-cover{height:205px;background:#e9eef8;overflow:hidden}.car-cover img{width:100%;height:100%;object-fit:cover;display:block}.car-content{padding:18px}.tag{display:inline-flex;background:var(--blue2);color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:5px 9px;border-radius:7px}.car-content h2{font-size:21px;margin:10px 0 5px;letter-spacing:-.4px}.car-content p{color:var(--muted);margin:0;min-height:48px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--ink);font-weight:700;cursor:pointer;transition:.15s}.btn:hover{background:#f7f9fd;border-color:#cbd4e4}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#2448c8}.btn.danger{color:var(--red);border-color:#f1caca}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}
.pager{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:28px}.pg{border:1px solid var(--line);background:#fff;min-width:38px;height:38px;border-radius:9px;cursor:pointer;font-weight:700}.pg.active{background:var(--blue);color:#fff;border-color:var(--blue)}.empty{background:white;border:1px dashed #cbd3e1;border-radius:var(--r);padding:55px 20px;text-align:center;color:var(--muted)}.empty h2{color:var(--ink);margin:0 0 7px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:35px;align-items:start}.detail-main{background:#e9eef8;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10}.detail-main img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumb{width:85px;height:65px;padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:#e9eef8;cursor:pointer}.thumb.active{border-color:var(--blue)}.thumb img{width:100%;height:100%;object-fit:cover}.detail-info h1{font-size:35px;line-height:1.12;letter-spacing:-1px;margin:13px 0}.detail-info p{color:var(--muted);white-space:pre-line}.detail-stats{display:flex;gap:15px;color:var(--muted);font-size:13px;margin:18px 0 24px}
.auth-wrap{max-width:430px;margin:20px auto}.panel,.auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}.auth-card h1{margin:0 0 7px}.hint{color:var(--muted);font-size:13px;margin:0 0 20px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:white}.field textarea{min-height:125px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315be81a}.error{color:var(--red);font-size:13px;min-height:20px}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:23px;align-items:start}.admin-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px;position:sticky;top:92px}.admin-side .side-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px;padding:8px 10px}.admin-side a,.admin-side button{display:flex;width:100%;padding:10px;border:0;background:transparent;border-radius:9px;text-align:left;color:var(--muted);font-weight:700;cursor:pointer}.admin-side a:hover,.admin-side a.active,.admin-side button:hover{background:var(--blue2);color:var(--blue)}.admin-content{min-width:0}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.admin-top h1{margin:0;font-size:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:30px;letter-spacing:-1px;margin-top:4px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{background:#f7f9fc;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:6px;white-space:nowrap}
.form-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.upload-box{border:1px dashed #bdc8dc;border-radius:12px;padding:15px;background:#fafbfe}.preview{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.preview-item{position:relative;width:95px;height:75px;border-radius:9px;overflow:hidden;background:#e8edf6}.preview-item img{width:100%;height:100%;object-fit:cover}.preview-item button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#fff;color:var(--red);width:22px;height:22px;cursor:pointer}.category-list{display:grid;gap:9px}.category-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px}.muted{color:var(--muted)}.notice{padding:12px 14px;background:#eef4ff;color:#3150a8;border-radius:10px;font-size:13px;margin:14px 0}
footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);text-align:center;padding:22px;font-size:13px}
.toast{position:fixed;right:20px;bottom:20px;background:#172238;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{background:#b83232}.toast.success{background:#16794a}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.admin-layout{grid-template-columns:1fr}.admin-side{position:static;display:flex;overflow:auto;gap:4px}.admin-side .side-title{display:none}.admin-side a,.admin-side button{width:auto;white-space:nowrap}}
@media(max-width:600px){.container{padding:0 15px}header{height:64px}.brand{font-size:17px}.brand-icon{width:33px;height:33px}.nav a{font-size:12px;padding:8px}.grid{grid-template-columns:1fr}.car-cover{height:210px}.toolbar{flex-direction:column}.toolbar select{width:100%}.stats{grid-template-columns:1fr}.form-layout{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}.panel,.auth-card{padding:19px}.detail-info h1{font-size:29px}}
</style>
</head>
<body>
<header><div class="container head">
<a class="brand" href="#/"><span class="brand-icon">🚘</span> Формы авто</a>
<nav class="nav"><a href="#/" id="nav-home">Каталог</a><a href="#/admin" id="nav-admin">Админ-панель</a></nav>
</div></header>
<main id="app" class="container"></main>
<footer>Учебный проект · HTML / CSS / JavaScript · данные сохраняются в этом браузере</footer>
<div id="toast" class="toast"></div>
<script>
'use strict';
const KEY={forms:'cf_forms',cats:'cf_categories',next:'cf_nextId',admin:'cf_admin',init:'cf_initialized'};
const DEFAULT_ADMIN={login:'admin',password:'admin123'};
const PER_PAGE=6,MAX_IMAGE=500*1024;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toLocaleDateString('ru-RU');
function toast(message,type='info'){const el=document.getElementById('toast');el.textContent=message;el.className='toast '+type+' show';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function placeholder(label,color='#315be8'){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#172238"/></linearGradient></defs><rect width="900" height="560" fill="url(#g)"/><path d="M130 345h640l-55-105q-15-30-50-30H290q-35 0-55 32z" fill="#ffffff" opacity=".18"/><circle cx="280" cy="370" r="55" fill="#182238" stroke="#fff" stroke-width="12"/><circle cx="640" cy="370" r="55" fill="#182238" stroke="#fff" stroke-width="12"/><text x="450" y="130" fill="white" font-family="Arial" font-size="54" font-weight="bold" text-anchor="middle">${esc(label)}</text><text x="450" y="490" fill="#dce6ff" font-family="Arial" font-size="22" text-anchor="middle">СПРАВОЧНИК ФОРМ АВТОМОБИЛЕЙ</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
async function hashPassword(pwd){if(window.crypto?.subtle){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}}return simpleHash(pwd)}
function simpleHash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 'fb'+(h2>>>0).toString(16)+(h1>>>0).toString(16)}
function getForms(){try{return JSON.parse(localStorage.getItem(KEY.forms)||'[]')}catch(e){return []}}
function setForms(v){try{localStorage.setItem(KEY.forms,JSON.stringify(v))}catch(e){toast('Не хватает места. Удалите часть изображений.','error');throw e}}
function getCats(){try{return JSON.parse(localStorage.getItem(KEY.cats)||'[]')}catch(e){return []}}
function setCats(v){localStorage.setItem(KEY.cats,JSON.stringify(v))}
function nextId(){const n=+(localStorage.getItem(KEY.next)||'1');localStorage.setItem(KEY.next,String(n+1));return n}
function isAuthed(){return sessionStorage.getItem(KEY.admin)==='1'}
function requireAuth(){if(!isAuthed()){location.hash='#/admin/login';return false}return true}
const seed=[
['Седан','Легковые','Классический кузов с отдельным багажником.','Седан — трёхобъёмный тип кузова: моторный отсек, салон и багажник конструктивно разделены. Обычно имеет четыре двери. Примеры: Toyota Camry, Hyundai Sonata.','#315be8'],
['Хэтчбек','Легковые','Компактный кузов с задней дверью, открывающейся вместе со стеклом.','Хэтчбек отличается укороченной задней частью и большой пятой дверью. Удобен в городе и позволяет перевозить крупные вещи при сложенных сиденьях. Примеры: Volkswagen Golf, Kia Ceed.','#15965b'],
['Универсал','Легковые','Удлинённая крыша и вместительный багажный отсек.','Универсал построен на базе легкового автомобиля, но имеет увеличенный багажный отсек и крышу, продолжающуюся до задней части кузова. Примеры: Škoda Octavia Combi, Volvo V60.','#d18a27'],
['Купе','Легковые','Спортивный кузов с двумя дверями и покатой крышей.','Купе обычно имеет две двери, низкую посадку и динамичный силуэт. Главный акцент сделан на дизайне и водительских ощущениях. Примеры: BMW 4 Series Coupe, Ford Mustang.','#8056d8'],
['Внедорожник (SUV)','Внедорожники','Высокий кузов, увеличенный клиренс и просторный салон.','Внедорожники и кроссоверы имеют высокий кузов, увеличенный дорожный просвет и часто полный привод. Подходят для поездок по разным типам дорог. Примеры: Toyota Land Cruiser, Hyundai Tucson.','#c84c43'],
['Пикап','Грузовые','Кабина и открытая грузовая платформа в одном автомобиле.','Пикап сочетает пассажирскую кабину и открытую грузовую платформу. Используется для перевозки грузов и поездок по сложным дорогам. Примеры: Toyota Hilux, Ford Ranger.','#536579']
];
async function init(){if(!localStorage.getItem(KEY.init)){setCats(['Легковые','Внедорожники','Грузовые']);const forms=seed.map((s,i)=>({id:i+1,title:s[0],category:s[1],short_description:s[2],description:s[3],main_image:placeholder(s[0],s[4]),images:[placeholder(s[0]+' — вид 1',s[4]),placeholder(s[0]+' — вид 2',s[4])],views:0,created_at:now(),updated_at:now()}));setForms(forms);localStorage.setItem(KEY.next,'7');localStorage.setItem(KEY.admin,JSON.stringify({login:DEFAULT_ADMIN.login,hash:await hashPassword(DEFAULT_ADMIN.password)}));localStorage.setItem(KEY.init,'1')}route()}
function route(){const parts=(location.hash.slice(1)||'/').split('/').filter(Boolean);document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));document.getElementById(parts[0]==='admin'?'nav-admin':'nav-home').classList.add('active');window.scrollTo(0,0);
if(parts[0]==='form'&&parts[1])return renderForm(+parts[1]);
if(parts[0]==='admin'){if(parts[1]==='login')return renderLogin();if(parts[1]==='logout'){sessionStorage.removeItem(KEY.admin);toast('Вы вышли','success');location.hash='/';return}if(!requireAuth())return;if(parts[1]==='forms')return renderAdminForms();if(parts[1]==='categories')return renderCategories();if(parts[1]==='form'&&parts[2]==='add')return renderAdminForm(null);if(parts[1]==='form'&&parts[2]==='edit')return renderAdminForm(+parts[3]);return renderDashboard()}
renderHome()}
let homeState={q:'',cat:'',page:1};
function renderHome(){homeState={q:'',cat:'',page:1};app.innerHTML=`<div class="page-head"><div class="eyebrow">Автомобильная энциклопедия</div><h1>Справочник форм автомобилей</h1><p>Изучайте типы кузова, их особенности и примеры автомобилей.</p></div><div class="toolbar"><input class="control" id="search" type="search" placeholder="⌕  Поиск по названию..."><select class="control" id="category"><option value="">Все категории</option>${getCats().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="results"></div>`;
document.getElementById('search').addEventListener('input',e=>{homeState.q=e.target.value;homeState.page=1;renderHomeList()});document.getElementById('category').addEventListener('change',e=>{homeState.cat=e.target.value;homeState.page=1;renderHomeList()});document.getElementById('results').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b&&!b.disabled){homeState.page=+b.dataset.page;renderHomeList()}});renderHomeList()}
function renderHomeList(){const q=homeState.q.trim().toLowerCase(),cat=homeState.cat;const all=getForms().filter(f=>(!q||f.title.toLowerCase().includes(q)||f.short_description.toLowerCase().includes(q))&&(!cat||f.category===cat)).sort((a,b)=>b.id-a.id);const pages=Math.max(1,Math.ceil(all.length/PER_PAGE));homeState.page=Math.min(homeState.page,pages);const items=all.slice((homeState.page-1)*PER_PAGE,homeState.page*PER_PAGE);const el=document.getElementById('results');if(!items.length){el.innerHTML='<div class="empty"><h2>Ничего не найдено</h2>Измените поисковый запрос или категорию.</div>';return}
el.innerHTML=`<div class="grid">${items.map(f=>`<a class="car-card" href="#/form/${f.id}"><div class="car-cover"><img src="${f.main_image}" alt="${esc(f.title)}"></div><div class="car-content"><span class="tag">${esc(f.category)}</span><h2>${esc(f.title)}</h2><p>${esc(f.short_description)}</p><div class="meta"><span>Открыть описание →</span><span>👁 ${f.views}</span></div></div></a>`).join('')}</div>${pages>1?`<div class="pager"><button class="pg" data-page="${homeState.page-1}" ${homeState.page===1?'disabled':''}>←</button>${Array.from({length:pages},(_,i)=>i+1).map(n=>`<button class="pg ${n===homeState.page?'active':''}" data-page="${n}">${n}</button>`).join('')}<button class="pg" data-page="${homeState.page+1}" ${homeState.page===pages?'disabled':''}>→</button></div>`:''}`}
function renderForm(id){const forms=getForms(),i=forms.findIndex(f=>f.id===id);if(i<0){app.innerHTML='<div class="empty"><h2>Запись не найдена</h2><a class="btn primary" href="#/">Вернуться в каталог</a></div>';return}forms[i].views=(forms[i].views||0)+1;setForms(forms);const f=forms[i],imgs=[f.main_image,...(f.images||[])];app.innerHTML=`<p><a class="btn small" href="#/">← Назад в каталог</a></p><div class="detail"><div><div class="detail-main"><img id="mainImg" src="${imgs[0]}" alt="${esc(f.title)}"></div><div class="thumbs">${imgs.map((src,n)=>`<button class="thumb ${n===0?'active':''}" data-img="${n}"><img src="${src}" alt="Фото ${n+1}"></button>`).join('')}</div></div><div class="detail-info"><span class="tag">${esc(f.category)}</span><h1>${esc(f.title)}</h1><p>${esc(f.description||f.short_description)}</p><div class="detail-stats"><span>👁 ${f.views} просмотров</span><span>Обновлено: ${esc(f.updated_at)}</span></div><a class="btn primary" href="#/">← Все формы кузова</a></div></div>`;
app.querySelectorAll('[data-img]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('mainImg').src=imgs[+b.dataset.img];app.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')}))}
function renderLogin(){app.innerHTML=`<div class="auth-wrap"><form class="auth-card" id="loginForm"><div class="eyebrow">Панель управления</div><h1>Вход в админ-панель</h1><p class="hint">Демо-доступ: <b>admin</b> / <b>admin123</b></p><div class="field"><label>Логин</label><input name="login" autocomplete="username" required autofocus></div><div class="field"><label>Пароль</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" type="submit">Войти в систему →</button><div class="error" id="loginError"></div></form></div>`;
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),saved=JSON.parse(localStorage.getItem(KEY.admin)||'{}'),hash=await hashPassword(fd.get('password'));if(fd.get('login')===saved.login&&hash===saved.hash){sessionStorage.setItem(KEY.admin,'1');toast('Вход выполнен','success');location.hash='/admin'}else document.getElementById('loginError').textContent='Неверный логин или пароль.'})}
function adminShell(content,active){return `<div class="admin-layout"><aside class="admin-side"><div class="side-title">УПРАВЛЕНИЕ</div><a class="${active==='dash'?'active':''}" href="#/admin">▦ Обзор</a><a class="${active==='forms'?'active':''}" href="#/admin/forms">▤ Записи</a><a class="${active==='cats'?'active':''}" href="#/admin/categories">▧ Категории</a><a href="#/admin/logout">↪ Выйти</a></aside><div class="admin-content">${content}</div></div>`}
function renderDashboard(){const forms=getForms(),views=forms.reduce((s,f)=>s+(f.views||0),0);const content=`<div class="admin-top"><div><div class="eyebrow">Панель управления</div><h1>Обзор</h1></div><a class="btn primary" href="#/admin/form/add">＋ Добавить запись</a></div><div class="stats"><div class="stat"><span>Всего записей</span><strong>${forms.length}</strong></div><div class="stat"><span>Категорий</span><strong>${getCats().length}</strong></div><div class="stat"><span>Просмотров</span><strong>${views}</strong></div></div><div class="panel"><h2 style="margin-top:0">Последние записи</h2>${forms.length?`<div class="table-wrap"><table><thead><tr><th>Название</th><th>Категория</th><th>Просмотры</th><th></th></tr></thead><tbody>${forms.slice().sort((a,b)=>b.id-a.id).slice(0,5).map(f=>`<tr><td><b>${esc(f.title)}</b></td><td>${esc(f.category)}</td><td>${f.views||0}</td><td><a class="btn small" href="#/admin/form/edit/${f.id}">Изменить</a></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Записей пока нет.</p>'}</div><div class="notice">Данные хранятся локально в браузере. Для демонстрации проекта сервер и база данных не требуются.</div>`;
app.innerHTML=adminShell(content,'dash')}
function renderAdminForms(){const forms=getForms().sort((a,b)=>b.id-a.id);const content=`<div class="admin-top"><div><div class="eyebrow">Контент</div><h1>Записи справочника</h1></div><a class="btn primary" href="#/admin/form/add">＋ Добавить</a></div><div class="table-wrap"><table><thead><tr><th>Название</th><th>Категория</th><th>Просмотры</th><th>Обновлено</th><th>Действия</th></tr></thead><tbody>${forms.map(f=>`<tr><td><b>${esc(f.title)}</b></td><td>${esc(f.category)}</td><td>${f.views||0}</td><td>${esc(f.updated_at)}</td><td><div class="row-actions"><a class="btn small" href="#/form/${f.id}" title="Просмотр">👁</a><a class="btn small" href="#/admin/form/edit/${f.id}" title="Изменить">✎</a><button class="btn small danger" data-del="${f.id}" title="Удалить">🗑</button></div></td></tr>`).join('')}</tbody></table></div>${forms.length?'':'<p class="muted">Добавьте первую запись.</p>'}`;
app.innerHTML=adminShell(content,'forms');app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{const f=getForms().find(x=>x.id===+b.dataset.del);if(f&&confirm(`Удалить запись «${f.title}»?`)){setForms(getForms().filter(x=>x.id!==f.id));toast('Запись удалена','success');renderAdminForms()}}))}
let editImages=[];
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function validImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))return 'Разрешены JPG, PNG и WEBP.';if(file.size>MAX_IMAGE)return 'Размер изображения не должен превышать 500 КБ.';return null}
function renderAdminForm(id){const old=id?getForms().find(f=>f.id===id):null;if(id&&!old){toast('Запись не найдена','error');location.hash='/admin/forms';return}editImages=old?[...(old.images||[])]:[];let mainImage=old?.main_image||'';const content=`<div class="admin-top"><div><div class="eyebrow">Контент</div><h1>${old?'Редактирование':'Новая запись'}</h1></div><a class="btn" href="#/admin/forms">← К списку</a></div><form class="panel" id="editForm"><div class="form-layout"><div><div class="field"><label>Название формы кузова *</label><input name="title" required maxlength="80" value="${esc(old?.title||'')}" placeholder="Например, Лифтбек"></div><div class="field"><label>Категория *</label><select name="category" required>${getCats().map(c=>`<option ${old?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Краткое описание *</label><textarea name="short" required maxlength="220" placeholder="Кратко опишите особенности...">${esc(old?.short_description||'')}</textarea></div><div class="field"><label>Полное описание</label><textarea name="description" placeholder="Подробное описание, особенности и примеры...">${esc(old?.description||'')}</textarea></div></div><div><div class="field"><label>Главное изображение</label><div class="upload-box"><input type="file" id="mainFile" accept="image/jpeg,image/png,image/webp"><div class="hint">JPG, PNG или WEBP. Максимум 500 КБ.</div><div class="preview" id="mainPreview">${mainImage?`<div class="preview-item"><img src="${mainImage}"></div>`:''}</div></div></div><div class="field"><label>Дополнительные изображения</label><div class="upload-box"><input type="file" id="galleryFiles" accept="image/jpeg,image/png,image/webp" multiple><div class="hint">Можно выбрать несколько изображений, каждое до 500 КБ.</div><div class="preview" id="galleryPreview"></div></div></div></div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><a class="btn" href="#/admin/forms">Отмена</a><button class="btn primary" type="submit">${old?'Сохранить изменения':'Добавить запись'}</button></div></form>`;
app.innerHTML=adminShell(content,'forms');const mainPreview=document.getElementById('mainPreview'),galleryPreview=document.getElementById('galleryPreview');
function drawGallery(){galleryPreview.innerHTML=editImages.map((src,i)=>`<div class="preview-item"><img src="${src}"><button type="button" data-remove="${i}">×</button></div>`).join('');galleryPreview.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{editImages.splice(+b.dataset.remove,1);drawGallery()})}drawGallery();
document.getElementById('mainFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const err=validImage(file);if(err){toast(err,'error');e.target.value='';return}try{mainImage=await readFile(file);mainPreview.innerHTML=`<div class="preview-item"><img src="${mainImage}"></div>`}catch{toast('Не удалось прочитать файл','error')}});
document.getElementById('galleryFiles').addEventListener('change',async e=>{for(const file of [...e.target.files]){const err=validImage(file);if(err){toast(err,'error');continue}try{editImages.push(await readFile(file))}catch{toast('Ошибка чтения изображения','error')}}drawGallery();e.target.value=''});
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),title=fd.get('title').trim(),short=fd.get('short').trim();if(!title||!short){toast('Заполните обязательные поля','error');return}if(!mainImage){toast('Добавьте главное изображение','error');return}const forms=getForms(),data={title,category:fd.get('category'),short_description:short,description:fd.get('description').trim(),main_image:mainImage,images:editImages,updated_at:now()};if(old){const i=forms.findIndex(f=>f.id===id);forms[i]={...forms[i],...data}}else forms.push({id:nextId(),...data,views:0,created_at:now()});setForms(forms);toast(old?'Изменения сохранены':'Запись добавлена','success');location.hash='/admin/forms'})}
function renderCategories(){const cats=getCats(),content=`<div class="admin-top"><div><div class="eyebrow">Структура каталога</div><h1>Категории</h1></div></div><div class="panel"><form id="catAdd" style="display:flex;gap:9px"><input class="control" name="name" placeholder="Название новой категории" required maxlength="40" style="flex:1;min-width:0"><button class="btn primary">＋ Добавить</button></form><div class="category-list" style="margin-top:18px">${cats.map(c=>`<div class="category-item"><div><b>${esc(c)}</b><div class="muted" style="font-size:12px">${getForms().filter(f=>f.category===c).length} записей</div></div><div class="row-actions"><button class="btn small" data-rename="${esc(c)}">Переименовать</button><button class="btn small danger" data-catdel="${esc(c)}">Удалить</button></div></div>`).join('')}</div></div>`;
app.innerHTML=adminShell(content,'cats');document.getElementById('catAdd').addEventListener('submit',e=>{e.preventDefault();const name=new FormData(e.currentTarget).get('name').trim();if(!name)return;if(getCats().some(c=>c.toLowerCase()===name.toLowerCase())){toast('Такая категория уже существует','error');return}setCats([...getCats(),name]);toast('Категория добавлена','success');renderCategories()});
app.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const old=b.dataset.rename,name=prompt('Новое название категории:',old)?.trim();if(!name||name===old)return;if(getCats().some(c=>c.toLowerCase()===name.toLowerCase())){toast('Такая категория уже существует','error');return}setCats(getCats().map(c=>c===old?name:c));setForms(getForms().map(f=>f.category===old?{...f,category:name,updated_at:now()}:f));toast('Категория переименована','success');renderCategories()});
app.querySelectorAll('[data-catdel]').forEach(b=>b.onclick=()=>{const name=b.dataset.catdel,count=getForms().filter(f=>f.category===name).length;if(count){toast(`Нельзя удалить: в категории ${count} записей`,'error');return}if(confirm(`Удалить категорию «${name}»?`)){setCats(getCats().filter(c=>c!==name));renderCategories();toast('Категория удалена','success')}})}
window.addEventListener('hashchange',route);
init();
</script>
</body>
</html>
